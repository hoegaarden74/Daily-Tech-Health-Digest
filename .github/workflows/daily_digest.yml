name: Daily Tech & Health Digest Pipeline

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 06:17 실행 (UTC 기준 21:17)
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Daily Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.5-flash
        run: |
          python generate_digest.py

      - name: Validate generated files
        run: |
          test -s index.html
          test -s history.json
          python -m json.tool history.json > /dev/null

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Update Daily Tech & Health Digest [$(date +'%Y-%m-%d')]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp index.html site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
